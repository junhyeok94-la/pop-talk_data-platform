name: pop-talk-data-platform

x-airflow: &airflow
  image: pop-talk-airflow:3.3.1-local
  build:
    context: .
    dockerfile: orchestration/airflow/Dockerfile
  env_file: .local/config/airflow.env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__PARALLELISM: '4'
    AIRFLOW__CORE__MAX_ACTIVE_TASKS_PER_DAG: '4'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__TEST_CONNECTION: Enabled
    AIRFLOW__API__EXPOSE_CONFIG: 'true'
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: 'true'
    POP_TALK_PROJECT_ROOT: /opt/airflow/modules
    POP_TALK_PLATFORM_POSTGRES_HOST: db
    POP_TALK_PLATFORM_POSTGRES_PORT: '5432'
    POP_TALK_PLATFORM_POSTGRES_DB: ${POSTGRES_DB}
    POP_TALK_DBT_PROJECT_DIR: /opt/airflow/dbt
    PYTHONPATH: /opt/airflow/modules:/opt/airflow/plugins:/opt/airflow/scripts:/opt/airflow
    AIRFLOW_WORKBENCH_OLLAMA_URL: http://host.docker.internal:11434
    AIRFLOW_WORKBENCH_REQUIRE_WORKER: 'true'
    # 관리자 생성은 초기화 서비스에서만 실행한다.
    _AIRFLOW_WWW_USER_CREATE: ''
  volumes:
    - ./orchestration/airflow/dags:/opt/airflow/dags
    - ./orchestration/airflow/plugins:/opt/airflow/plugins
    - ./orchestration/airflow/modules:/opt/airflow/modules:ro
    - ./orchestration/airflow/scripts:/opt/airflow/scripts:ro
    - ./orchestration/airflow/config:/opt/airflow/config:ro
    - ./orchestration/airflow/tests:/opt/airflow/tests:ro
    - ./transformation/dbt:/opt/airflow/dbt:ro
    - ./.local/data/initial:/opt/airflow/initial:ro
    - ./orchestration/airflow/logs:/opt/airflow/logs
    - ./.local/data/airflow-workbench:/opt/airflow/workbench
  extra_hosts:
    - host.docker.internal:host-gateway
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Run python scripts/configure.py first}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run python scripts/configure.py first}
      POSTGRES_DB: ${POSTGRES_DB:?Run python scripts/configure.py first}
    ports:
      - 127.0.0.1:${POSTGRES_PORT:-55433}:5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 20

  # 플랫폼 DB에서 Airflow 초기화를 한 번에 수행한다.
  airflow-init:
    <<: *airflow
    entrypoint: [python, /opt/airflow/scripts/initialize_platform.py]
    environment:
      <<: *airflow-env
      POP_TALK_PLATFORM_ADMIN_USER: ${POSTGRES_USER}
      POP_TALK_PLATFORM_ADMIN_PASSWORD: ${POSTGRES_PASSWORD}
      _AIRFLOW_WWW_USER_CREATE: 'true'
    volumes:
      - ./orchestration/airflow/modules:/opt/airflow/modules:ro
      - ./orchestration/airflow/scripts:/opt/airflow/scripts:ro
      - ./orchestration/airflow/plugins:/opt/airflow/plugins:ro
    depends_on:
      db:
        condition: service_healthy

  airflow-apiserver:
    <<: *airflow
    command: api-server
    ports:
      - 127.0.0.1:8080:8080
    healthcheck:
      test: [CMD, curl, --fail, http://localhost:8080/api/v2/monitor/health]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler

  airflow-dag-processor:
    <<: *airflow
    command: dag-processor

  airflow-triggerer:
    <<: *airflow
    command: triggerer

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-pop-talk-data-platform_postgres_data}
