pop_talk_dw:
  target: dev
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'configure-account') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'POP_TALK_DBT_USER') }}"
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/keys/pop_talk_dbt_key.p8') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE', 'POP_TALK_DW_DEV_ROLE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE', 'POP_TALK_DW_DEV') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE', 'POP_TALK_DW_WH') }}"
      schema: STAGING
      threads: 2
      client_session_keep_alive: false
      query_tag: pop_talk_dbt_dev
